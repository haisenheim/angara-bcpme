version: "3"
services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 'secret'
    ports:
      - "3306:3306"
    network_mode: bridge

  adonis:
    image: alliages/angara-instruction:latest
    ports:
      - "3333:8080"
    depends_on:
      - mysql
    network_mode: bridge




